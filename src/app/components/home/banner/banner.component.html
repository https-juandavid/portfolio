<section class="section banner">
    <div class="container">
        <div class="section-box-banner">
            <div class="content">
                <div class="banner-pretitle">
                    <p class="banner-pretitle-text">{{"Banner.Pretitle" | translate}}</p>
                </div>
                <div class='banner-title'>
                    <h1 class="banner-name" [innerHTML]="'Banner.Name' | translate"></h1>
                    <p class="banner-subtitle" [innerHTML]="'Banner.Subtitle' | translate"></p>
                </div>
                <div class='banner-description'>
                    <p class="banner-tagline" [innerHTML]='"Banner.Tagline" | translate'></p>
                    <p class="banner-lead" [innerHTML]='"Banner.Description" | translate'></p>
                </div>
            </div>
            <div class="div-btn-banner">
                <app-dynamic-button
                    [text]='"Banner.ActionBtn" | translate'
                    href="mailto:juandavid.dev00@outlook.com"
                    target="_blank"
                    analyticsEvent="click_send_mail"
                    analyticsCategory="banner"
                    analyticsLabel="email"
                    variant="primary">
                </app-dynamic-button>
            </div>
        </div>
    </div>


</section>
