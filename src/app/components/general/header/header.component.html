<nav [@animateMenu] class="navbar main-navbar on-top" [class.nav-shadow]='this.pageYPosition>0'>
    <div class="container">
        <a class="navbar-brand text-light" [href]="'/' + languageService.language" (click)="goHome($event)">
            <img src='assets/images/logo-juan.png' width='40' height='58' alt="Juan David Contreras, inicio" />
        </a>
        <ul ngbNav #nav="ngbNav" class="menu-ul">
            <li ngbNavItem *ngFor="let item of navItems; let n = index">
                <a ngbNavLink (click)='onNavClick(item)'><span class='nav-number'>0{{ n + 1 }}. </span> <span class="underline nav-text"> {{ item.label | translate }}</span></a>
            </li>
            <li ngbNavItem>
                <app-dynamic-button
                  [text]="'Header.cvBtn' | translate"
                  (buttonClick)="downloadCV()"
                  variant="primary"
                  size="small"
                  analyticsEvent="click_cv"
                  analyticsCategory="menu"
                  analyticsLabel="cv_download">
                </app-dynamic-button>
            </li>
            <li>
                <div ngbDropdown class="d-inline-block">
                    <div class="language-container" id="dropdownForm1" ngbDropdownToggle>
                        <img *ngIf='languageFormControl.value == "en"' width="20px" src="https://www.worldometers.info/img/flags/us-flag.gif" alt="English">
                        <span *ngIf='languageFormControl.value == "en"' class="flag-text">English</span>

                        <img *ngIf='languageFormControl.value == "es"' width="20px" src="https://www.worldometers.info/img/flags/sp-flag.gif" alt="Español">
                        <span *ngIf='languageFormControl.value == "es"' class="flag-text">Español</span>
                        <svg class='arrow-language' xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M0 7.33l2.829-2.83 9.175 9.339 9.167-9.339 2.829 2.83-11.996 12.17z"/></svg>
                    </div>
                    <div ngbDropdownMenu aria-labelledby="dropdownForm1">
                        <div (click)='changeLanguage("es")' (keydown.enter)='changeLanguage("es")' role="button" tabindex="0" [attr.aria-pressed]='languageFormControl.value == "es"'style='border-bottom-left-radius: 0px !important;border-bottom-right-radius: 0px !important;' class="language-container language-container-selector active" [class.active]='languageFormControl.value == "es"'>
                            <img width="20px" src="https://www.worldometers.info/img/flags/sp-flag.gif" alt="Español">
                            <span class="flag-text">Español</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2 arrow-active" viewBox="0 0 16 16">
                                <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                              </svg>
                        </div>
                        <div (click)='changeLanguage("en")' (keydown.enter)='changeLanguage("en")' role="button" tabindex="0" [attr.aria-pressed]='languageFormControl.value == "en"'style="margin-top: 1px !important; border-top-left-radius: 0px !important; border-top-right-radius: 0px !important;" class="language-container language-container-selector" [class.active]='languageFormControl.value == "en"'>
                            <img width="20px" src="https://www.worldometers.info/img/flags/us-flag.gif" alt="English">
                            <span class="flag-text">English</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2 arrow-active" viewBox="0 0 16 16">
                                <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
        <div class="menu-wrapper">
            <div [class.animate]='responsiveMenuVisible' (click)='toggleMenu()'
                 (keydown.enter)='toggleMenu(); $event.preventDefault()' (keydown.space)='toggleMenu(); $event.preventDefault()'
                 class="hamburger-menu" role="button" tabindex="0" aria-controls="mobile-menu"
                 [attr.aria-expanded]="responsiveMenuVisible" aria-label="Menu"></div>
        </div>
        <div class="menu-responsive" [ngStyle]="{'pointer-events': !responsiveMenuVisible ? 'none' : '' }">
            <!-- inert while closed so hidden links are skipped by Tab and screen readers -->
            <aside id="mobile-menu" [class.aside-show]='responsiveMenuVisible' [class.nav-shadow]='this.pageYPosition>0' class="on-top"
                   [attr.inert]="responsiveMenuVisible ? null : ''">
                <nav>
                    <ol>
                        <li *ngFor="let item of navItems">
                            <a [href]="'#' + item.id" (click)='$event.preventDefault(); onNavClick(item)'>
                                {{ item.label | translate }}
                            </a>
                        </li>
                      <li>
                          <app-dynamic-button
                            [text]="'Header.cvBtn' | translate"
                            (buttonClick)="downloadCV()"
                            variant="primary"
                            size="small"
                            analyticsEvent="click_cv"
                            analyticsCategory="menu"
                            analyticsLabel="cv_download">
                          </app-dynamic-button>
                      </li>
                      <li>
                            <div class="language-container">
                                <div (click)='changeLanguage("es")' (keydown.enter)='changeLanguage("es")' role="button" tabindex="0" [attr.aria-pressed]='languageFormControl.value == "es"'style='border-bottom-left-radius: 0px !important;border-bottom-right-radius: 0px !important;' class="language-container language-container-selector active" [class.active]='languageFormControl.value == "es"'>
                                    <img src="https://www.worldometers.info/img/flags/sp-flag.gif" alt="Español">
                                    <span class="flag-text">Español</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2 arrow-active" viewBox="0 0 16 16">
                                        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                                      </svg>
                                </div>
                                <div (click)='changeLanguage("en")' (keydown.enter)='changeLanguage("en")' role="button" tabindex="0" [attr.aria-pressed]='languageFormControl.value == "en"'style="margin-top: 1px !important; border-top-left-radius: 0px !important; border-top-right-radius: 0px !important;" class="language-container language-container-selector" [class.active]='languageFormControl.value == "en"'>
                                    <img src="https://www.worldometers.info/img/flags/us-flag.gif" alt="English">
                                    <span class="flag-text">English</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2 arrow-active" viewBox="0 0 16 16">
                                        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                                    </svg>
                                </div>
                            </div>
                      </li>
                        <!-- <li>
                            <img src="https://www.worldometers.info/img/flags/us-flag.gif" alt="English">
                        </li> -->


                    </ol>
                </nav>
            </aside>
        </div>
    </div>
</nav>
